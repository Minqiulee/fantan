<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>羊多一點 · 工作人員端</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ccircle cx='11' cy='11' r='3' fill='%23fff'/%3E%3Ccircle cx='21' cy='21' r='3' fill='%23fff'/%3E%3C/svg%3E">
<script src="i18n.js"></script>
<style>
  :root {
    --bg1: #101627; --bg2: #16233d;
    --card: rgba(255,255,255,.07);
    --card-border: rgba(255,255,255,.13);
    --text: #eef1ff; --muted: #93a0bd;
    --gold: #ffd45e; --gold-deep: #f5a623;
    --ok: #34d399; --bad: #f87171;
    --accent: #4f8cff;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2) 70%);
    color: var(--text);
    min-height:100vh; padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center;
  }
  .wrap { width:100%; max-width:640px; position:relative; }

  header { text-align:center; margin:10px 0 6px; padding:0 8px; }
  header h1 { font-size:28px; letter-spacing:2px; }
  header h1 .tag { font-size:13px; vertical-align:middle; margin-left:8px; padding:3px 10px; border-radius:99px;
    background:linear-gradient(135deg,#4f8cff,#2f6fe0); color:#fff; font-weight:700; white-space:nowrap; }
  /* 窄屏：标题与标签一起缩，避免「工作人员端」被拆成两行 */
  @media (max-width: 360px) {
    header h1 { font-size:23px; letter-spacing:1px; }
    header h1 .tag { font-size:12px; padding:2px 8px; margin-left:6px; }
  }
  .round { color:var(--muted); font-size:14px; margin-top:6px; }

  .status-pill {
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:14px auto 18px; width:fit-content; padding:9px 22px; border-radius:99px;
    font-size:16px; font-weight:600; letter-spacing:1px;
    background:var(--card); border:1px solid var(--card-border);
  }
  .status-pill .dot { width:10px; height:10px; border-radius:50%; }
  .st-input .dot { background:var(--gold); animation:pulse 1.4s infinite; }
  .st-locked .dot { background:var(--ok); }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }

  .card {
    background:var(--card); border:1px solid var(--card-border);
    border-radius:20px; padding:22px 20px; margin-bottom:16px;
    backdrop-filter: blur(8px);
  }
  .card h2 { font-size:18px; margin-bottom:14px; }
  .card h2.row-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .card h2 .row-head-meta { margin-left:auto; font-size:13px; font-weight:400; color:var(--muted); }

  /* 场次条 */
  .sess-bar { display:flex; align-items:center; gap:12px; padding:16px 18px; }
  .sb-left { min-width:0; flex:1; }
  .sb-lab { font-size:12px; color:var(--muted); letter-spacing:1px; }
  .sb-name { font-size:18px; font-weight:700; margin-top:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sb-badge { font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px;
    background:rgba(52,211,153,.16); color:var(--ok); border:1px solid rgba(52,211,153,.45); }
  .sb-badge.closed { background:rgba(148,163,184,.14); color:var(--muted); border-color:rgba(148,163,184,.4); }
  .empty-session { text-align:center; padding:8px 4px 4px; }
  .empty-session p { color:var(--muted); font-size:14px; line-height:1.7; margin:8px 0 4px; }

  /* 顶栏：语言在左，管理 / 切换场次在右（与玩家端顶栏同一套胶囊按钮） */
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:2px; }
  .top-right { display:flex; align-items:center; gap:8px; }
  .sess-btn {
    font-size:13px; padding:6px 14px; border-radius:99px; cursor:pointer;
    background:rgba(0,0,0,.25); border:1px solid var(--card-border); color:var(--muted);
    font-weight:600; transition:all .12s ease;
  }
  .sess-btn:active { transform:scale(.96); }

  /* 场次选择（与玩家端同构：整行选项 + 尾随箭头/对勾 + 取消切换） */
  .sess-pick { display:flex; flex-direction:column; gap:10px; }
  .sess-opt {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
    padding:15px 16px; border-radius:14px; font-size:17px; font-weight:800; letter-spacing:1px;
    background:rgba(0,0,0,.25); color:var(--text); border:1.5px solid var(--card-border);
    transition:all .12s ease;
  }
  .sess-opt:active { transform:scale(.98); }
  .sess-opt .so-main { flex:1; min-width:0; }
  .sess-opt .so-meta { display:block; font-size:12px; font-weight:500; color:var(--muted);
    margin-top:5px; letter-spacing:0; }
  .sess-opt .so-go { color:var(--gold); font-size:20px; flex:none; }
  .sess-opt.cur { border-color:rgba(79,140,255,.7); background:rgba(79,140,255,.14);
    box-shadow:0 0 0 1px rgba(79,140,255,.35) inset; }
  .sess-opt.cur .so-go { color:var(--ok); }
  .sess-cancel {
    display:block; width:100%; margin-top:12px; padding:11px; border-radius:12px; cursor:pointer;
    background:none; border:1px solid var(--card-border); color:var(--muted); font-size:14px; font-weight:600;
  }
  .hint { font-size:12.5px; color:var(--muted); line-height:1.65; margin-top:12px; }

  .btn {
    width:100%; margin-top:14px; padding:16px; font-size:19px; font-weight:700; letter-spacing:2px;
    border:none; border-radius:14px; color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#4f8cff,#2f6fe0);
    transition: transform .08s ease, opacity .2s;
  }
  .btn:active { transform:scale(.97); }
  .btn[disabled] { opacity:.4; pointer-events:none; }
  .btn.gold { background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#3a2500; }
  .btn.warn { background:linear-gradient(135deg,#f87171,#e5484d); }

  .stats { display:flex; gap:12px; margin-top:16px; width:100%; }
  .stats .st { flex:1; text-align:center; padding:12px 6px; border-radius:14px;
    background:rgba(0,0,0,.25); border:1px solid var(--card-border); }
  .stats .st .n { font-size:26px; font-weight:800; color:var(--gold); }
  .stats .st .t { font-size:12px; color:var(--muted); margin-top:3px; }

  /* 数字录入 */
  .numgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .numgrid button {
    padding:20px 0; font-size:28px; font-weight:800; border-radius:16px;
    background:rgba(0,0,0,.28); color:var(--text); border:2px solid var(--card-border); cursor:pointer;
    transition: all .12s ease;
  }
  .numgrid button.sel { background:linear-gradient(135deg,var(--gold),var(--gold-deep));
    border-color:#ffe9a8; color:#3a2500; transform:scale(1.04); }
  .sel-preview { text-align:center; margin:16px 0 2px; font-size:15px; color:var(--muted); }
  .sel-preview b { font-size:24px; color:var(--gold); margin:0 4px; }
  .err { color:var(--bad); font-size:14px; margin-top:10px; min-height:18px; }

  /* 登录锁 */
  .lock { text-align:center; padding:20px 4px 6px; }
  .lock .icon { width:64px; height:64px; margin:0 auto 16px; border-radius:18px; display:flex; align-items:center; justify-content:center;
    background:rgba(79,140,255,.16); border:1px solid rgba(79,140,255,.4); }
  .lock .icon svg { width:30px; height:30px; }
  .lock h2 { font-size:19px; margin-bottom:6px; }
  input[type=password], input[type=text] {
    width:100%; font-size:19px; padding:15px 16px; border-radius:14px;
    border:1.5px solid var(--card-border); background:rgba(0,0,0,.25); color:var(--text); outline:none;
    letter-spacing:2px; text-align:center;
  }
  input[type=password]:focus, input[type=text]:focus { border-color:var(--accent); }
  /* 账号输入不做字距，且与密码框留出间隔 */
  input[type=text] { letter-spacing:0; font-size:17px; }
  .lock input + input { margin-top:10px; }
  /* 账号徽标（顶栏显示当前登录人） */
  .user-chip {
    font-size:12.5px; padding:6px 12px; border-radius:99px; color:var(--muted);
    background:rgba(0,0,0,.22); border:1px solid var(--card-border); font-weight:600;
    max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .user-chip b { color:var(--text); font-weight:700; }
  .modal input[type=password] { margin-bottom:16px; font-size:17px; }
  .logout-link { display:block; margin:16px auto 0; background:none; border:none; color:var(--muted);
    font-size:13px; cursor:pointer; text-decoration:underline; }

  /* 已确认视图 */
  .locked-banner { text-align:center; }
  .locked-banner .n { font-size:92px; font-weight:900; line-height:1.05;
    background:linear-gradient(180deg,var(--gold),var(--gold-deep)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .locked-banner .lab { color:var(--ok); font-size:16px; font-weight:700; letter-spacing:2px; }

  table { width:100%; border-collapse:collapse; font-size:15px; }
  th,td { padding:10px 6px; text-align:center; }
  th { color:var(--muted); font-weight:600; font-size:13px; border-bottom:1px solid var(--card-border); }
  td { border-bottom:1px solid rgba(255,255,255,.06); }
  .hit-txt { color:var(--ok); font-weight:700; } .miss-txt { color:var(--bad); }
  .empty { text-align:center; color:var(--muted); font-size:14px; padding:14px 0; }

  /* 本轮玩家列表 + 新老玩家区分 */
  .plist { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .plist .p { display:flex; align-items:center; gap:8px; padding:7px 13px; border-radius:12px; font-size:14px; }
  .plist .p .nm { max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plist .p .tag-n { font-size:11px; padding:2px 8px; border-radius:99px; font-weight:700; flex:none; }
  /* 新玩家：蓝色系 */
  .p.is-new { background:rgba(79,140,255,.14); border:1px solid rgba(79,140,255,.45); }
  .p.is-new .nm { color:#cfe0ff; }
  .p.is-new .tag-n { background:rgba(79,140,255,.25); color:#7fb2ff; }
  /* 老玩家：金色系 */
  .p.is-vet { background:rgba(255,212,94,.12); border:1px solid rgba(255,212,94,.4); }
  .p.is-vet .nm { color:#ffe9b0; }
  .p.is-vet .tag-n { background:rgba(255,212,94,.22); color:var(--gold); }

  /* 每日对账（归档口径，不含积分）—— 已移到管理界面 /admin */

  #toast { position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    background:rgba(15,20,35,.95); border:1px solid var(--card-border); color:var(--text);
    padding:13px 24px; border-radius:14px; font-size:15px; opacity:0; pointer-events:none;
    transition:all .25s ease; z-index:99; max-width:86vw; text-align:center; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.err { border-color:rgba(248,113,113,.6); }
  #toast.ok { border-color:rgba(52,211,153,.6); }

  /* 自定义确认弹窗 */
  .modal-mask { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
    padding:24px; background:rgba(8,12,24,.6); backdrop-filter:blur(4px);
    opacity:0; pointer-events:none; transition:opacity .18s ease; }
  .modal-mask.show { opacity:1; pointer-events:auto; }
  .modal {
    width:100%; max-width:340px; background:#1a2440; border:1px solid var(--card-border);
    border-radius:20px; padding:24px 22px 20px; text-align:center;
    transform:translateY(8px) scale(.98); transition:transform .18s ease;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .modal-mask.show .modal { transform:translateY(0) scale(1); }
  .modal .m-ico { width:52px; height:52px; margin:0 auto 14px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; }
  .modal .m-ico svg { width:26px; height:26px; }
  .modal.warn .m-ico { background:rgba(248,113,113,.16); border:1px solid rgba(248,113,113,.45); }
  .modal.plain .m-ico { background:rgba(79,140,255,.16); border:1px solid rgba(79,140,255,.45); }
  .modal .m-title { font-size:18px; font-weight:700; margin-bottom:10px; }
  .modal .m-body { font-size:14px; line-height:1.6; color:var(--muted); margin-bottom:20px;
    white-space:pre-line; }
  .modal .m-body b { color:var(--gold); font-size:17px; }
  .modal .m-actions { display:flex; gap:10px; }
  .modal .m-actions button { flex:1; padding:13px 0; font-size:16px; font-weight:700;
    border:none; border-radius:12px; cursor:pointer; letter-spacing:1px; transition:transform .08s ease, opacity .2s; }
  .modal .m-actions button:active { transform:scale(.96); }
  .m-btn-cancel { background:rgba(255,255,255,.08); color:var(--text); border:1px solid var(--card-border); }
  .m-btn-ok { background:linear-gradient(135deg,#4f8cff,#2f6fe0); color:#fff; }
  .modal.warn .m-btn-ok { background:linear-gradient(135deg,#f87171,#e5484d); }

  .hidden { display:none !important; }
  .conn-lost { text-align:center; color:var(--muted); font-size:13px; padding:8px 0; }

  /* 窄屏：语言按钮与顶栏按钮同一行放不下时允许换行，不挤压标题 */
  @media (max-width: 400px) {
    .topbar { flex-wrap:wrap; }
    .top-right { width:100%; justify-content:flex-end; }
  }

  /* 语言切换（顶栏左侧） */
  .lang-switch { display:flex; align-items:center; }
  .lang-btn {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-size:13px; padding:6px 14px; border-radius:99px; cursor:pointer;
    background:rgba(0,0,0,.25); border:1px solid var(--card-border); color:var(--text);
    font-weight:600; transition:all .12s ease;
  }
  .lang-btn svg { width:18px; height:18px; flex:none; }
  .lang-btn .lang-code { font-size:13px; font-weight:600; letter-spacing:.5px; }
  .lang-btn:active { transform:scale(.96); }
</style>
</head>
<body>
<div class="wrap">
  <!-- 顶栏：语言在左；管理 / 切换场次在右（与玩家端顶栏同位置、同款胶囊按钮） -->
  <div class="topbar">
    <div class="lang-switch" id="langSwitch" aria-label="Language">
      <button class="lang-btn" id="langBtn" type="button" aria-label="切换语言">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span class="lang-code" id="langCode">繁體</span>
      </button>
    </div>
    <div class="top-right">
      <span class="user-chip hidden" id="userChip"></span>
      <button class="sess-btn hidden" id="adminBtn" type="button" data-i18n="adminEntry">管理</button>
      <button class="sess-btn hidden" id="switchSessBtn" type="button" data-i18n="sessionSwitch">切换场次</button>
    </div>
  </div>

  <header>
    <h1><span data-i18n="brand">羊多一点</span><span class="tag" data-i18n="staffTag">工作人员端</span></h1>
    <div class="round" id="roundInfo">—</div>
  </header>

  <!-- 登录锁 -->
  <div class="card" id="loginCard">
    <div class="lock">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </div>
      <h2 data-i18n="loginTitle">工作人员登录</h2>
      <input type="text" id="userInput" placeholder="账号" data-i18n-placeholder="userPlaceholder"
             autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
      <input type="password" id="pwdInput" placeholder="登录密码" data-i18n-placeholder="pwdPlaceholder" autocomplete="current-password">
      <button class="btn" id="loginBtn" data-i18n="unlock">登录</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>

  <!-- 主内容（登录后显示） -->
  <div id="mainContent" class="hidden">

  <!-- 场次条：只展示当前场次（切换入口在顶栏，与玩家端一致） -->
  <div class="card sess-bar" id="sessionBar">
    <div class="sb-left">
      <div class="sb-lab" data-i18n="sessionLabel">当前场次</div>
      <div class="sb-name"><span id="sbName">—</span><span class="sb-badge hidden" id="sbBadge"></span></div>
    </div>
  </div>

  <!-- 选择场次（与玩家端同构：展开式选项列表，取消即原样退回） -->
  <div class="card hidden" id="cardSession">
    <h2 data-i18n="sessionPickTitle">选择场次</h2>
    <div class="sess-pick" id="sessPick"></div>
    <button class="sess-cancel hidden" id="sessCancel" type="button" data-i18n="sessionCancelSwitch">取消切换</button>
    <div class="hint" data-i18n="sessionListHint">切换只影响你自己的员工端，不会打扰其他场次。</div>
  </div>

  <!-- 无可用场次 -->
  <div class="card hidden" id="noSessionCard">
    <div class="empty-session">
      <p data-i18n="sessionEmpty">当前没有进行中的场次，请到管理界面新建一个。</p>
      <button class="btn" id="btnGoAdmin" data-i18n="adminGoCreate">前往管理界面</button>
    </div>
  </div>

  <div id="sessionBody">
  <div class="status-pill st-input" id="statusPill"><span class="dot"></span><span id="statusText">待录入</span></div>

  <!-- 本轮玩家统计 -->
  <div class="card">
    <h2 data-i18n="overview">本轮概况</h2>
    <div class="stats">
      <div class="st"><div class="n" id="cntReg">0</div><div class="t" data-i18n="cntReg">已扫码玩家</div></div>
      <div class="st"><div class="n" id="cntPred">0</div><div class="t" data-i18n="cntPred">已提交预测</div></div>
    </div>
  </div>

  <!-- 本轮玩家列表（新老玩家区分） -->
  <div class="card">
    <h2 class="row-head"><span data-i18n="playerListTitle">本轮玩家</span><span class="row-head-meta" id="plistCount"></span></h2>
    <div class="plist" id="playerList"></div>
  </div>

  <!-- 待录入：录入并确认数字 -->
  <div class="card" id="cardInput">
    <h2 data-i18n="inputTitle">录入本轮数字</h2>
    <div class="numgrid" id="numGrid">
      <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button>
      <button data-n="5">5</button><button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button>
    </div>
    <div class="sel-preview"><span data-i18n="selPreview">已选数字</span><b id="selShow">—</b></div>
    <div class="err" id="inputErr"></div>
    <button class="btn gold" id="confirmBtn" disabled data-i18n="confirmLock">确认并锁定本轮数字</button>
  </div>

  <!-- 已确认：结果总览 -->
  <div class="card hidden" id="cardLocked">
    <div class="locked-banner">
      <div class="lab" data-i18n="lockedBanner">✓ 本轮数字已确认并锁定</div>
      <div class="n" id="lockedNum">?</div>
    </div>
    <div id="resultTableWrap"></div>
    <button class="btn warn" id="resetBtn" data-i18n="resetRound">开始新一轮</button>
  </div>
  </div><!-- /sessionBody -->

  <div class="conn-lost hidden" id="connLost" data-i18n="connLost">⚠ 连接中断，正在重试…</div>
  <button class="logout-link" id="logoutBtn" data-i18n="logout">退出登录</button>
  </div>
</div>
<div id="toast"></div>

<!-- 自定义确认弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox">
    <div class="m-ico" id="modalIco"></div>
    <div class="m-title" id="modalTitle"></div>
    <div class="m-body" id="modalBody"></div>
    <div class="m-actions">
      <button class="m-btn-cancel" id="modalCancel"></button>
      <button class="m-btn-ok" id="modalOk"></button>
    </div>
  </div>
</div>
<!-- 切换场次口令（场景级口令，与登录密码、玩家口令互不复用） -->
<div class="modal-mask" id="switchPwdMask">
  <div class="modal plain">
    <div class="m-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>
    <div class="m-title" data-i18n="switchPwdTitle">切换场次</div>
    <div class="m-body" data-i18n="switchPwdBody">请输入「切换场次」口令</div>
    <input type="password" id="switchPwdInput" autocomplete="off" inputmode="numeric">
    <div class="err" id="switchPwdErr"></div>
    <div class="m-actions">
      <button class="m-btn-cancel" id="switchPwdCancel" type="button" data-i18n="modalCancelText">取消</button>
      <button class="m-btn-ok" id="switchPwdOk" type="button" data-i18n="switchPwdOk">确认切换</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'oe_staff_token';
  var token = sessionStorage.getItem(TOKEN_KEY) || '';
  var sid = '';                 // 当前归属的场次（服务端 token 绑定为准，这里保存一份用于渲染）
  var sessions = [];            // 场次列表（员工视角，含已关闭）
  var state = null, selNum = null, confirming = false;
  var picking = false;          // 是否展开「选择场次」（与玩家端同一套交互）
  var loggedIn = false;         // 是否已通过员工登录（控制顶栏入口显隐）
  var me = { username: '', role: 'staff', displayName: '' }; // 当前登录账号（决定管理入口可见）
  var pwdTargetSid = '';        // 待切换的目标场次（口令弹层的上下文）
  window.I18N.init({ storageKey: 'oe_staff_locale' });
  var t = window.I18N.t;

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 语言切换 ---------- */
  var LANG_LABEL = { 'zh-HK': '繁體', 'zh-CN': '简体', 'en-US': 'EN' };

  /** 刷新语言按钮上的短标签（单个地球按钮，显示当前语言码）。 */
  function updateLangButton() {
    var code = $('langCode');
    var lang = window.I18N.getLocale();
    if (code) code.textContent = LANG_LABEL[lang] || lang;
  }

  $('langBtn').addEventListener('click', function () {
    var next = window.I18N.nextLocale();
    if (window.I18N.setLocale(next)) {
      applyStaticI18n();
      renderSessionBar();
      renderSessionPick();
      render();
    }
  });

  /** 应用静态文本（data-i18n / data-i18n-placeholder），并刷新语言按钮标签 */
  function applyStaticI18n() {
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
      el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder')));
    });
    document.title = t('brand') + ' · ' + t('staffTag');
    updateLangButton();
  }

  var toastTimer = null;
  function toast(msg, type) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'show ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ''; }, 2600);
  }

  /* ---------- 自定义确认弹窗 ---------- */
  var modalResolve = null;
  var ICON = {
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>',
    plain: '<svg viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>'
  };

  /** 弹出自定义确认框。opts: { type:'warn'|'plain', title, body(HTML), okText, cancelText }。
   *  返回 Promise<boolean>，用户点确认 resolve(true)，取消/关闭 resolve(false)。 */
  function confirmModal(opts) {
    if (modalResolve) modalResolve(false); // 已有弹窗未决时先关闭旧的
    var box = $('modalBox');
    box.className = 'modal ' + (opts.type === 'warn' ? 'warn' : 'plain');
    $('modalIco').innerHTML = opts.type === 'warn' ? ICON.warn : ICON.plain;
    $('modalTitle').textContent = opts.title;
    $('modalBody').innerHTML = opts.body;
    $('modalOk').textContent = opts.okText;
    $('modalCancel').textContent = opts.cancelText;
    $('modalMask').classList.add('show');
    return new Promise(function (resolve) {
      modalResolve = function (v) { resolve(v); };
    });
  }

  function closeModal(v) {
    $('modalMask').classList.remove('show');
    if (modalResolve) { var r = modalResolve; modalResolve = null; r(v); }
  }

  $('modalOk').addEventListener('click', function () { closeModal(true); });
  $('modalCancel').addEventListener('click', function () { closeModal(false); });
  $('modalMask').addEventListener('click', function (e) { if (e.target === $('modalMask')) closeModal(false); });

  function setAuth(tk) {
    token = tk;
    if (tk) sessionStorage.setItem(TOKEN_KEY, tk);
    else sessionStorage.removeItem(TOKEN_KEY);
    // 管理界面会把同一份 token 存到 localStorage 以便独立打开；退出登录时一并清掉，避免残留登录态
    if (!tk) { try { localStorage.removeItem('oe_admin_token'); } catch (e) { /* 忽略 */ } }
  }

  function showLogin() {
    loggedIn = false;
    picking = false;
    $('loginCard').classList.remove('hidden');
    $('mainContent').classList.add('hidden');
    renderLayout();
  }

  function showMain() {
    loggedIn = true;
    $('loginCard').classList.add('hidden');
    $('mainContent').classList.remove('hidden');
    renderLayout();
  }

  function esc(x) {
    return String(x).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  /* ---------- 场次：渲染 ---------- */
  function currentSession() {
    for (var i = 0; i < sessions.length; i++) if (sessions[i].id === sid) return sessions[i];
    return null;
  }

  /** 切换列表只列进行中的场次（与玩家端一致，已关闭的不能切进去） */
  function openSessions() {
    return sessions.filter(function (s) { return s.status === 'open'; });
  }

  /** 场次条：只展示当前场次名称与状态，入口统一在顶栏 */
  function renderSessionBar() {
    var cur = currentSession();
    $('sbName').textContent = cur ? cur.name : '—';
    var badge = $('sbBadge');
    if (cur) {
      badge.classList.remove('hidden');
      badge.textContent = t(cur.status === 'open' ? 'sessionStatusOpen' : 'sessionStatusClosed');
      badge.className = 'sb-badge' + (cur.status === 'open' ? '' : ' closed');
    } else {
      badge.classList.add('hidden');
    }
    renderLayout();
  }

  /** 顶栏账号徽标：显示显示名（管理员额外标角色），鼠标悬停看账号 */
  function renderUserChip() {
    var el = $('userChip');
    if (!me.username) { el.innerHTML = ''; el.classList.add('hidden'); return; }
    var label = me.displayName || me.username;
    el.innerHTML = esc(label) + (me.role === 'admin' ? ' · <b>' + esc(t('roleAdmin')) + '</b>' : '');
    el.title = me.username + (me.role === 'admin' ? ' (' + t('roleAdmin') + ')' : '');
  }

  /** 顶栏 / 卡片显隐：展开选择时只留选择卡（与玩家端 picking 表现一致） */
  function renderLayout() {
    var cur = currentSession();
    renderUserChip();
    // 「管理」只给管理员：员工有自己的一套场次操作，不该看到对账与账号管理
    $('adminBtn').classList.toggle('hidden', !loggedIn || me.role !== 'admin');
    $('userChip').classList.toggle('hidden', !loggedIn || !me.username);
    $('switchSessBtn').classList.toggle('hidden', !loggedIn || picking || !openSessions().length);
    $('cardSession').classList.toggle('hidden', !loggedIn || !picking);
    $('sessCancel').classList.toggle('hidden', !loggedIn || !picking || !cur);
    $('sessionBar').classList.toggle('hidden', !loggedIn || picking);
    $('sessionBody').classList.toggle('hidden', !loggedIn || picking || !cur);
    $('noSessionCard').classList.toggle('hidden', !loggedIn || picking || !!cur);
  }

  /** 选择场次卡里的选项列表（整行可点，当前场次打勾） */
  function renderSessionPick() {
    var box = $('sessPick');
    var list = openSessions();
    if (!list.length) {
      box.innerHTML = '<div class="empty">' + esc(t('sessionNoOpen')) + '</div>';
      return;
    }
    box.innerHTML = list.map(function (s) {
      var meta = t('roundInfo', { round: s.round }) + ' · ' +
        (s.locked ? t('roundLocked') : t('roundOngoing')) + ' · ' +
        t('sessionPlayersCount', { n: s.players });
      var cur = s.id === sid ? ' cur' : '';
      return '<button class="sess-opt' + cur + '" type="button" data-sid="' + esc(s.id) + '">' +
        '<span class="so-main">' + esc(s.name) +
        '<span class="so-meta">' + esc(meta) + '</span></span>' +
        '<span class="so-go">' + (cur ? '✓' : '›') + '</span></button>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.sess-opt'), function (b) {
      b.addEventListener('click', function () { chooseSession(b.getAttribute('data-sid')); });
    });
  }

  /** 员工视角刷新场次列表（含已关闭；切换列表只取进行中） */
  function refreshSessions() {
    if (!token) return Promise.resolve();
    return fetch('/api/sessions?token=' + encodeURIComponent(token), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok && d.sessions) {
          sessions = d.sessions;
          renderSessionBar();
          renderSessionPick();
        }
      })
      .catch(function () {});
  }

  /* ---------- 场次：交互 ---------- */
  function postJson(path, body) {
    return fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  /** 点选场次：已在本场则直接收起；否则切换（员工需先过「切换场次」口令） */
  function chooseSession(id) {
    if (!id) return;
    if (id === sid) { picking = false; renderLayout(); return; }
    if (me.role === 'admin') { doSelectSession(id, null); return; } // 管理员免口令（服务端同口径）
    openSwitchPwd(id);
  }

  /** 切换场次：只改自己的绑定，重建 SSE 连接并拉取该场次状态 */
  function doSelectSession(id, sessionPassword) {
    var body = { token: token, sid: id };
    if (sessionPassword != null) body.sessionPassword = sessionPassword;
    postJson('/api/session-select', body).then(function (d) {
      if (d.ok) {
        closeSwitchPwd();
        picking = false;
        applySessionSwitch(d.sid, d.sessions);
        var cur = currentSession();
        toast(t('toastSessionSwitched', { name: cur ? cur.name : '' }), 'ok');
      } else if (d.code === 'unauthorized') { forceLogout(); }
      else if (d.code === 'staff_session_password_required' || d.code === 'staff_wrong_password' ||
               d.code === 'staff_too_many_attempts') {
        // 口令缺失 / 错误 / 限频：留在口令弹层里提示，不要静默失败
        openSwitchPwd(id);
        $('switchPwdErr').textContent = window.I18N.errCode(d.code, d) || t('errLoginFailed');
      } else { toast(window.I18N.errCode(d.code, d) || t('errOpFailed'), 'err'); }
    }).catch(function () { toast(t('errNetRetry'), 'err'); });
  }

  /* ---------- 切换场次口令弹层 ---------- */
  function openSwitchPwd(id) {
    pwdTargetSid = id;
    $('switchPwdInput').value = '';
    $('switchPwdErr').textContent = '';
    $('switchPwdMask').classList.add('show');
    setTimeout(function () { try { $('switchPwdInput').focus(); } catch (e) { /* 忽略 */ } }, 120);
  }

  function closeSwitchPwd() {
    $('switchPwdMask').classList.remove('show');
    $('switchPwdInput').value = '';
    $('switchPwdErr').textContent = '';
    pwdTargetSid = '';
  }

  function submitSwitchPwd() {
    if (!pwdTargetSid) { closeSwitchPwd(); return; }
    var pw = $('switchPwdInput').value;
    if (!pw) { $('switchPwdErr').textContent = t('errEmptyPwd'); return; }
    doSelectSession(pwdTargetSid, pw);
  }

  $('switchPwdOk').addEventListener('click', submitSwitchPwd);
  $('switchPwdCancel').addEventListener('click', closeSwitchPwd);
  $('switchPwdMask').addEventListener('click', function (e) {
    if (e.target === $('switchPwdMask')) closeSwitchPwd();
  });
  $('switchPwdInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submitSwitchPwd(); }
    if (e.key === 'Escape') { e.preventDefault(); closeSwitchPwd(); }
  });

  /** 场次切换后的本地复位：清空选择、重建连接、重新拉状态 */
  function applySessionSwitch(nextSid, list) {
    sid = nextSid || '';
    if (list) sessions = list;
    state = null;
    resetNumberSelection();
    renderSessionBar();
    renderSessionPick();
    if (sid) { startStream(); poll(); }
    else { closeStream(); render(); }
  }

  function resetNumberSelection() {
    selNum = null;
    $('selShow').textContent = '—';
    $('confirmBtn').disabled = true;
    $('inputErr').textContent = '';
    Array.prototype.forEach.call(document.querySelectorAll('#numGrid button'), function (x) { x.classList.remove('sel'); });
  }

  /** 打开选择场次（不发请求前提：刷新列表后会重绘） */
  function openPicker() {
    picking = true;
    renderSessionPick();
    renderLayout();
    refreshSessions();
  }

  function closePicker() {
    picking = false;
    renderLayout();
  }

  /** 管理界面：当日对账 / 大屏 / 新建场次 / 关闭场次 都在 /admin */
  function goAdmin() {
    if (!token) { showLogin(); return; }
    location.href = '/admin';
  }

  $('switchSessBtn').addEventListener('click', openPicker);
  $('sessCancel').addEventListener('click', closePicker);
  $('adminBtn').addEventListener('click', goAdmin);
  $('btnGoAdmin').addEventListener('click', goAdmin);

  /* ---------- 渲染 ---------- */
  function render() {
    var s = state;
    if (!s) { $('roundInfo').textContent = '—'; return; }

    $('roundInfo').textContent = s.session.name + ' · ' + t('roundInfo', { round: s.round }) +
      (s.locked ? ' · ' + t('roundLocked') : ' · ' + t('roundOngoing'));

    var locked = s.locked;
    $('statusPill').className = 'status-pill ' + (locked ? 'st-locked' : 'st-input');
    $('statusText').textContent = t(locked ? 'statusLocked' : 'statusInput');

    $('cardInput').classList.toggle('hidden', locked);
    $('cardLocked').classList.toggle('hidden', !locked);

    var reg = s.players.length, pred = s.players.filter(function (p) { return p.submitted; }).length;
    $('cntReg').textContent = reg;
    $('cntPred').textContent = pred;

    renderPlayerList(s);

    if (locked) {
      $('lockedNum').textContent = s.number;
      var n = s.number;
      if (!s.players.length) {
        $('resultTableWrap').innerHTML = '<div class="empty">' + t('noPlayerReg') + '</div>';
        return;
      }
      var rows = s.players.map(function (p) {
        // 单双命中：基于开奖数字奇偶性判定，与语言无关（「单/單」「双/雙」字形差异不再影响结果）
        var pOE = (p.oddEven === '单') === (n % 2 === 1), pN = p.number === n;
        return '<tr><td>' + esc(p.id) + '</td>' +
          '<td>' + esc(p.oddEven || '—') + '</td>' +
          '<td>' + esc(p.number != null ? p.number : '—') + '</td>' +
          '<td class="' + (pOE ? 'hit-txt' : 'miss-txt') + '">' + (pOE ? t('hit') : t('miss')) + '</td>' +
          '<td class="' + (pN ? 'hit-txt' : 'miss-txt') + '">' + (pN ? t('hit') : t('miss')) + '</td></tr>';
      }).join('');
      $('resultTableWrap').innerHTML =
        '<table><tr><th>' + t('thPlayer') + '</th><th>' + t('thOddEven') + '</th><th>' + t('thNumber') +
        '</th><th>' + t('thOddEvenResult') + '</th><th>' + t('thNumberResult') + '</th></tr>' + rows + '</table>';
    }
  }

  /* ---------- 本轮玩家列表（新老区分） ---------- */
  function renderPlayerList(s) {
    var list = $('playerList');
    var vetCount = s.players.filter(function (p) { return p.isVeteran; }).length;
    var newCount = s.players.length - vetCount;
    $('plistCount').textContent = t('plistCount', { total: s.players.length, new: newCount, vet: vetCount });

    if (!s.players.length) {
      list.innerHTML = '<div class="empty">' + t('noPlayerYet') + '</div>';
      return;
    }
    list.innerHTML = s.players.map(function (p) {
      var cls = p.isVeteran ? 'is-vet' : 'is-new';
      var tag = p.isVeteran ? t('tagVet') : t('tagNew');
      return '<div class="p ' + cls + '">' +
        '<span class="nm">' + esc(p.id) + '</span>' +
        '<span class="tag-n">' + tag + '</span>' +
        '</div>';
    }).join('');
  }

  /* 当日对账 / 大屏 / 新建场次 / 关闭场次 已移到管理界面（/admin） */

  /* ---------- 网络（SSE 实时推送 + 断线重连） ---------- */
  var es = null;           // EventSource 实例
  var streamClosed = false; // 手动关闭标记

  function applyState(s) {
    if (!s || !s.ok) return;
    $('connLost').classList.add('hidden');
    var wasLocked = state ? state.locked : false;
    state = s;
    if (s.session) {
      // 场次名称可能被别的员工端改过（当前无改名功能，此处仅保持同步）
      sid = s.session.id;
    }
    render();
    if (!wasLocked && s.locked) toast(t('toastNumberLocked', { number: s.number }), 'ok');
  }

  /** 关闭当前 SSE 连接。 */
  function closeStream() {
    streamClosed = true;
    if (es) { es.close(); es = null; }
  }

  /** 建立 SSE 连接：绑定当前场次，只收本场次的事件。
   *  带员工 token：员工视角不受玩家场次口令约束。 */
  function startStream() {
    closeStream();
    if (!sid) return;
    streamClosed = false;
    es = new EventSource('/api/stream?sid=' + encodeURIComponent(sid) +
      (token ? '&token=' + encodeURIComponent(token) : ''));

    es.onopen = function () {
      $('connLost').classList.add('hidden');
      poll(); // 重连成功后全量对齐一次
    };

    es.addEventListener('state', function (ev) {
      try { applyState(JSON.parse(ev.data)); } catch (e) { /* 忽略坏帧 */ }
    });

    // 场次被关闭（可能是别的员工端关的）
    es.addEventListener('session_closed', function (ev) {
      var d = {};
      try { d = JSON.parse(ev.data) || {}; } catch (e) { /* 忽略坏帧 */ }
      if (d.sid && d.sid !== sid) return;
      closeStream();
      toast(t('toastSessionClosed', { name: (currentSession() || {}).name || '' }), 'err');
      refreshSessions().then(function () {
        var next = '';
        for (var i = 0; i < sessions.length; i++) { if (sessions[i].status === 'open') { next = sessions[i].id; break; } }
        applySessionSwitch(next, sessions);
      });
    });

    es.onerror = function () {
      if (streamClosed) return;
      if (es && es.readyState === EventSource.CONNECTING) {
        $('connLost').classList.remove('hidden');
      }
    };
  }

  /** 拉取一次当前场次的全量状态快照，用于对齐 SSE 断线/回到前台期间错过的变更。 */
  function poll() {
    if (!sid) return;
    fetch('/api/state?sid=' + encodeURIComponent(sid) + (token ? '&token=' + encodeURIComponent(token) : ''), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (s && s.ok) applyState(s);
        else if (s && s.code === 'session_not_found') {
          // 场次已不存在：回退到列表里的第一个进行中场次
          refreshSessions();
        }
      })
      .catch(function () {
        $('connLost').classList.remove('hidden');
      });
  }

  /* ---------- 交互 ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('#numGrid button'), function (b) {
    b.addEventListener('click', function () {
      if (state && state.locked) return;
      selNum = parseInt(b.getAttribute('data-n'), 10);
      Array.prototype.forEach.call(document.querySelectorAll('#numGrid button'), function (x) {
        x.classList.toggle('sel', x === b);
      });
      $('selShow').textContent = selNum;
      $('confirmBtn').disabled = false;
      $('inputErr').textContent = '';
    });
  });

  $('confirmBtn').addEventListener('click', async function () {
    if (confirming || !state || state.locked) return;
    if (selNum == null || !Number.isInteger(selNum) || selNum < 1 || selNum > 8) {
      $('inputErr').textContent = t('errPickNumber');
      return;
    }
    // 开奖前检查：分两类提示，语义完全不同
    //   未提交 = 没按确认提交（含「选了没确认」），锁定即作废，不算参赛
    //   待确认 = 已点选但没按确认提交，人数最多的一类争议来源，必须让员工看见
    var unpredicted = state.players.filter(function (p) { return !p.submitted; }).length;
    // 兼容两种投影：玩家视图带 draft 布尔，大屏视图只有 status（将来员工端切视图也不会漏算）
    var drafting = state.players.filter(function (p) {
      return p.draft === true || p.status === 'draft';
    }).length;
    var ack = false;
    if (unpredicted > 0) {
      var proceed = await confirmModal({
        type: 'warn',
        title: t('modalUnpredictedTitle'),
        body: t('modalUnpredictedBody', { count: unpredicted })
          + (drafting > 0 ? '<br><b>' + t('modalDraftNote', { count: drafting }) + '</b>' : ''),
        okText: t('modalUnpredictedOk'),
        cancelText: t('modalCancelText')
      });
      if (!proceed) return;
      ack = true;
    }
    var sure = await confirmModal({
      type: 'plain',
      title: t('modalConfirmTitle'),
      body: t('modalConfirmBody', { number: selNum }),
      okText: t('modalConfirmOk'),
      cancelText: t('modalCancelText')
    });
    if (!sure) return;

    confirming = true; $('confirmBtn').disabled = true;
    try {
      // 最多两轮：服务端若报「还有草稿未确认」（其他实例刚收到新草稿），再确认一次即带上 ackPending
      for (var attempt = 0; attempt < 2; attempt += 1) {
        var d = await postJson('/api/confirm', {
          number: selNum, token: token, sid: sid, ackPending: ack
        });
        if (d && d.ok) {
          if (d.archived === false) toast(t('toastArchiveFailed'), 'err');
          else toast(t('toastLocked', { number: d.number }), 'ok');
          poll();
          break;
        }
        if (d && d.code === 'pending_confirm_required' && !ack) {
          var n = (d.pending || []).length;
          var go = await confirmModal({
            type: 'warn',
            title: t('modalUnpredictedTitle'),
            body: t('modalDraftNote', { count: n }),
            okText: t('modalUnpredictedOk'),
            cancelText: t('modalCancelText')
          });
          if (!go) { $('confirmBtn').disabled = false; break; }
          ack = true;
          continue;
        }
        if (d && d.code === 'unauthorized') { forceLogout(); break; }
        $('inputErr').textContent = window.I18N.errCode(d && d.code, d) || t('errConfirmFailed');
        $('confirmBtn').disabled = false;
        poll();
        break;
      }
    } catch (e) {
      $('inputErr').textContent = t('errNetRetry');
      $('confirmBtn').disabled = false;
    } finally {
      confirming = false;
    }
  });

  $('resetBtn').addEventListener('click', async function () {
    if (!state || !state.locked) return;
    var sure = await confirmModal({
      type: 'plain',
      title: t('modalResetTitle'),
      body: t('modalResetBody'),
      okText: t('modalResetOk'),
      cancelText: t('modalCancelText')
    });
    if (!sure) return;
    postJson('/api/reset', { token: token, sid: sid }).then(function (d) {
      if (d.ok) {
        resetNumberSelection();
        toast(t('toastNewRound', { round: d.round }), 'ok');
        poll();
      } else if (d.code === 'unauthorized') { forceLogout(); }
      else { toast(window.I18N.errCode(d.code, d) || t('errOpFailed'), 'err'); }
    }).catch(function () { toast(t('errNetRetry'), 'err'); });
  });

  /* ---------- 登录 / 退出 ---------- */
  function forceLogout() {
    closeStream();
    closeSwitchPwd();
    setAuth('');
    me = { username: '', role: 'staff', displayName: '' };
    sessions = []; sid = ''; state = null;
    showLogin();
    toast(t('errSessionExpired'), 'err');
  }

  $('loginBtn').addEventListener('click', function () {
    var user = $('userInput').value.trim();
    var pw = $('pwdInput').value;
    $('loginErr').textContent = '';
    if (!user) { $('loginErr').textContent = t('errEmptyUser'); return; }
    if (!pw) { $('loginErr').textContent = t('errEmptyPwd'); return; }
    $('loginBtn').disabled = true;
    postJson('/api/staff-login', { username: user, password: pw }).then(function (d) {
      if (d.ok) {
        setAuth(d.token);
        me = d.user || { username: user, role: 'staff', displayName: '' };
        $('pwdInput').value = '';
        sessions = d.sessions || [];
        showMain();
        applySessionSwitch(d.sid || '', sessions);
      } else { $('loginErr').textContent = window.I18N.errCode(d.code, d) || t('errLoginFailed'); }
    }).catch(function () { $('loginErr').textContent = t('errNetRetry'); })
      .finally(function () { $('loginBtn').disabled = false; });
  });

  ['pwdInput', 'userInput'].forEach(function (id) {
    $(id).addEventListener('keydown', function (e) {
      if (e.key === 'Enter') $('loginBtn').click();
    });
  });

  $('logoutBtn').addEventListener('click', function () {
    closeStream();
    postJson('/api/staff-logout', { token: token });
    setAuth('');
    me = { username: '', role: 'staff', displayName: '' };
    sessions = []; sid = ''; state = null;
    showLogin();
  });

  /* 启动时校验会话有效性，并取回绑定的场次与账号 */
  fetch('/api/staff-check?token=' + encodeURIComponent(token)).then(function (r) { return r.json(); }).then(function (d) {
    if (d.ok) {
      me = d.user || me;
      sessions = d.sessions || [];
      showMain();
      applySessionSwitch(d.sid || '', sessions);
    } else showLogin();
  }).catch(function () { showLogin(); });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { startStream(); poll(); }
    else closeStream();
  });

  /* 初始化语言：应用静态文本 */
  updateLangButton();
  applyStaticI18n();
  renderSessionBar();
})();
</script>
</body>
</html>
