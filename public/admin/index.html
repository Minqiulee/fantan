<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>羊多一点 · 管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ccircle cx='11' cy='11' r='3' fill='%23fff'/%3E%3Ccircle cx='21' cy='21' r='3' fill='%23fff'/%3E%3C/svg%3E">
<script src="/shared/i18n.js"></script>
<link rel="stylesheet" href="/admin/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="lang-switch" aria-label="Language">
      <button class="lang-btn" id="langBtn" type="button" aria-label="切换语言">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span class="lang-code" id="langCode">繁體</span>
      </button>
    </div>
    <div class="top-right">
      <span class="user-chip hidden" id="userChip"></span>
      <button class="sess-btn hidden" id="toStaffBtn" type="button" data-i18n="adminToStaff">返回工作台</button>
    </div>
  </div>

  <header>
    <h1><span data-i18n="brand">羊多一点</span><span class="tag" data-i18n="adminTag">管理</span></h1>
    <div class="round" id="adminRound">—</div>
  </header>

  <!-- 登录锁 -->
  <div class="card hidden" id="loginCard">
    <div class="lock">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </div>
      <h2 data-i18n="adminLoginTitle">管理员登录</h2>
      <input type="text" id="userInput" placeholder="账号" data-i18n-placeholder="userPlaceholder"
             autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
      <input type="password" id="pwdInput" placeholder="登录密码" data-i18n-placeholder="pwdPlaceholder" autocomplete="current-password">
      <button class="btn" id="loginBtn" data-i18n="unlock">登录</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>

  <div id="mainContent" class="hidden">
    <!-- 当前场次 -->
    <div class="card sess-bar">
      <div class="sb-left">
        <div class="sb-lab" data-i18n="sessionLabel">当前场次</div>
        <div class="sb-name"><span id="sbName">—</span><span class="sb-badge hidden" id="sbBadge"></span></div>
        <div class="sb-meta" id="sbMeta"></div>
      </div>
    </div>

    <!-- 管理入口（对账 / 大屏 / 场次 / 账号 / 日志 / 奖品） -->
    <div class="entries" id="entries">
      <button class="entry" type="button" id="entryArchive">
        <span class="e-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16v4H4z"/><path d="M6 8v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"/><path d="M9 13h6"/>
          </svg>
        </span>
        <span class="e-title" data-i18n="archiveTitle">当日对账</span>
        <span class="e-desc" data-i18n="adminArchiveDesc"></span>
      </button>
      <button class="entry" type="button" id="entryBoard">
        <span class="e-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
          </svg>
        </span>
        <span class="e-title" data-i18n="bs_open">大屏</span>
        <span class="e-desc" data-i18n="adminBigscreenDesc"></span>
      </button>
      <button class="entry gold" type="button" id="entryCreate">
        <span class="e-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffd45e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14"/><path d="M5 12h14"/>
          </svg>
        </span>
        <span class="e-title" data-i18n="sessionCreate">新建场次</span>
        <span class="e-desc" data-i18n="adminCreateDesc"></span>
      </button>
      <button class="entry danger" type="button" id="entryClose">
        <span class="e-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9l6 6"/><path d="M15 9l-6 6"/>
          </svg>
        </span>
        <span class="e-title" data-i18n="sessionClose">关闭场次</span>
        <span class="e-desc" data-i18n="adminCloseDesc"></span>
      </button>
      <button class="entry" type="button" id="entryAccount">
        <span class="e-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 11h5"/><path d="M19.5 8.5v5"/>
          </svg>
        </span>
        <span class="e-title" data-i18n="accountTitle">员工账号</span>
        <span class="e-desc" data-i18n="adminAccountDesc"></span>
      </button>
      <button class="entry" type="button" id="entryAudit">
        <span class="e-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 3h11l3 3v15H5z"/><path d="M8 9h8"/><path d="M8 13h8"/><path d="M8 17h5"/>
          </svg>
        </span>
        <span class="e-title" data-i18n="auditTitle">操作日志</span>
        <span class="e-desc" data-i18n="adminAuditDesc"></span>
      </button>
      <button class="entry gold" type="button" id="entryPrize">
        <span class="e-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffd45e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 21V7"/>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
          </svg>
        </span>
        <span class="e-title" data-i18n="prizeTitle">奖品设置</span>
        <span class="e-desc" data-i18n="adminPrizeDesc"></span>
      </button>
    </div>

    <!-- 当日对账（归档口径，不含积分） -->
    <div id="archiveView" class="hidden">
      <button class="back-link" type="button" id="archiveBack">← <span data-i18n="adminBack">返回</span></button>
      <div class="card">
        <h2 class="row-head">
          <span data-i18n="archiveTitle">当日对账</span>
          <span class="row-head-meta"><input type="date" id="archiveDate" class="date-input"></span>
        </h2>
        <div class="stats">
          <div class="st"><div class="n" id="arSessions">0</div><div class="t" data-i18n="archiveSessions">场次</div></div>
          <div class="st"><div class="n" id="arRounds">0</div><div class="t" data-i18n="archiveRounds">已归档轮次</div></div>
          <div class="st"><div class="n" id="arMembers">0</div><div class="t" data-i18n="archiveMembers">参与人数(去重)</div></div>
        </div>
        <div class="arch-actions">
          <button type="button" data-level="detail" data-i18n="exportDetail">竞猜明细 CSV</button>
          <button type="button" data-level="round" data-i18n="exportRound">轮次核对 CSV</button>
        </div>
        <div class="arch-hint" data-i18n="archiveTip">按锁定时间统计 · 归档只增不改 · 不含积分</div>
      </div>
    </div>

    <!-- 员工账号（建号 / 改密 / 停用；一人一份独立密码） -->
    <div id="accountView" class="hidden">
      <button class="back-link" type="button" id="accountBack">← <span data-i18n="adminBack">返回</span></button>
      <div class="card">
        <h2 class="row-head">
          <span data-i18n="accountTitle">员工账号</span>
          <span class="row-head-meta"><button class="mini-btn" id="accountAddBtn" type="button" data-i18n="accountAdd">新建账号</button></span>
        </h2>
        <div class="rows" id="accountList"></div>
      </div>

      <div class="card hidden" id="accountForm">
        <h2 data-i18n="accountCreateTitle">新建员工账号</h2>
        <div class="form-row">
          <label data-i18n="accountColUser">账号</label>
          <input type="text" id="acUser" data-i18n-placeholder="accountUserPh" maxlength="32"
                 autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>
        <div class="form-row">
          <label data-i18n="accountNamePh">显示名（可选）</label>
          <input type="text" id="acName" data-i18n-placeholder="accountNamePh" maxlength="32" autocomplete="off">
        </div>
        <div class="form-row">
          <label data-i18n="accountPwdPh">登录密码</label>
          <input type="password" id="acPwd" data-i18n-placeholder="accountPwdPh" maxlength="64" autocomplete="new-password">
        </div>
        <div class="form-row">
          <label data-i18n="accountRoleLabel">角色</label>
          <div class="seg" id="acRole">
            <button type="button" data-role="staff" class="on" data-i18n="accountRoleStaff">员工</button>
            <button type="button" data-role="admin" data-i18n="accountRoleAdmin">管理员</button>
          </div>
        </div>
        <div class="err" id="acErr"></div>
        <div class="arch-actions">
          <button type="button" id="acCancel" data-i18n="modalCancelText">取消</button>
          <button type="button" id="acSave" data-i18n="accountCreateOk">创建</button>
        </div>
        <div class="arch-hint" data-i18n="accountCreateHint"></div>
      </div>
    </div>

    <!-- 操作日志（谁登录 / 谁锁定 / 谁导出） -->
    <div id="auditView" class="hidden">
      <button class="back-link" type="button" id="auditBack">← <span data-i18n="adminBack">返回</span></button>
      <div class="card">
        <h2 class="row-head">
          <span data-i18n="auditTitle">操作日志</span>
          <span class="row-head-meta"><input type="date" id="auditDate" class="date-input"></span>
        </h2>
        <div class="log-list" id="auditList"></div>
        <div class="arch-actions">
          <button type="button" id="auditExportBtn" data-i18n="auditExport">导出日志 CSV</button>
        </div>
        <div class="arch-hint" id="auditHint"></div>
      </div>
    </div>

    <!-- 奖品设置：各类结果各一份展示文案，玩家端开奖后按命中的最高档显示 -->
    <div id="prizeView" class="hidden">
      <button class="back-link" type="button" id="prizeBack">← <span data-i18n="adminBack">返回</span></button>
      <div class="card">
        <h2 class="row-head"><span data-i18n="prizeTitle">奖品设置</span></h2>
        <div class="arch-hint prize-tip" data-i18n="prizeHint"></div>
        <div class="arch-hint prize-tip prize-lang-tip" data-i18n="prizeLangHint"></div>
        <!-- 规则版本：奖品四档 + 特殊数字是一整套，按版本保存；只对之后新建的场次生效 -->
        <div class="rule-ver" id="prizeRuleVer">
          <span><span data-i18n="ruleVersionLab">当前规则版本</span>：<b id="prizeRuleVerNo">—</b></span>
          <span class="rv-sub" data-i18n="ruleVersionHint">保存后仅对之后新建的场次生效，正在进行的场次不受影响</span>
        </div>

        <!-- 每一档都拆成「简体中文 / 繁体中文 / English」三列，一列一种语言，
             玩家端按自己选的语言取对应那一列；示例占位符由 JS 按列固定（不随界面语言变）。 -->
        <div class="prize-block" data-tier="both">
          <div class="pb-head">
            <span class="pb-tier">1</span>
            <span class="pb-name" data-i18n="prizeTierBoth">数字和单双都中</span>
            <span class="pb-sub" data-i18n="prizeTierBothSub"></span>
          </div>
          <div class="lang-grid">
            <div class="lang-col" data-lang="zh-CN">
              <div class="lang-tag" data-i18n="pzLangZhCN">简体中文</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="pzBothTitleZhCN" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
                <textarea id="pzBothDescZhCN" maxlength="120" rows="2"></textarea>
              </div>
            </div>
            <div class="lang-col" data-lang="zh-HK">
              <div class="lang-tag" data-i18n="pzLangZhHK">繁体中文</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="pzBothTitleZhHK" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
                <textarea id="pzBothDescZhHK" maxlength="120" rows="2"></textarea>
              </div>
            </div>
            <div class="lang-col" data-lang="en-US">
              <div class="lang-tag" data-i18n="pzLangEnUS">English</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="pzBothTitleEnUS" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
                <textarea id="pzBothDescEnUS" maxlength="120" rows="2"></textarea>
              </div>
            </div>
          </div>
        </div>

        <div class="prize-block" data-tier="number">
          <div class="pb-head">
            <span class="pb-tier">2</span>
            <span class="pb-name" data-i18n="prizeTierNumber">只中数字</span>
            <span class="pb-sub" data-i18n="prizeTierNumberSub"></span>
          </div>
          <div class="lang-grid">
            <div class="lang-col" data-lang="zh-CN">
              <div class="lang-tag" data-i18n="pzLangZhCN">简体中文</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="pzNumberTitleZhCN" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
                <textarea id="pzNumberDescZhCN" maxlength="120" rows="2"></textarea>
              </div>
            </div>
            <div class="lang-col" data-lang="zh-HK">
              <div class="lang-tag" data-i18n="pzLangZhHK">繁体中文</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="pzNumberTitleZhHK" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
                <textarea id="pzNumberDescZhHK" maxlength="120" rows="2"></textarea>
              </div>
            </div>
            <div class="lang-col" data-lang="en-US">
              <div class="lang-tag" data-i18n="pzLangEnUS">English</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="pzNumberTitleEnUS" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
                <textarea id="pzNumberDescEnUS" maxlength="120" rows="2"></textarea>
              </div>
            </div>
          </div>
        </div>

        <div class="prize-block" data-tier="oddeven">
          <div class="pb-head">
            <span class="pb-tier">3</span>
            <span class="pb-name" data-i18n="prizeTierOddeven">只中单双</span>
            <span class="pb-sub" data-i18n="prizeTierOddevenSub"></span>
          </div>
          <div class="lang-grid">
            <div class="lang-col" data-lang="zh-CN">
              <div class="lang-tag" data-i18n="pzLangZhCN">简体中文</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="pzOddevenTitleZhCN" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
                <textarea id="pzOddevenDescZhCN" maxlength="120" rows="2"></textarea>
              </div>
            </div>
            <div class="lang-col" data-lang="zh-HK">
              <div class="lang-tag" data-i18n="pzLangZhHK">繁体中文</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="pzOddevenTitleZhHK" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
                <textarea id="pzOddevenDescZhHK" maxlength="120" rows="2"></textarea>
              </div>
            </div>
            <div class="lang-col" data-lang="en-US">
              <div class="lang-tag" data-i18n="pzLangEnUS">English</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="pzOddevenTitleEnUS" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
                <textarea id="pzOddevenDescEnUS" maxlength="120" rows="2"></textarea>
              </div>
            </div>
          </div>
        </div>

        <div class="prize-block" data-tier="miss">
          <div class="pb-head">
            <span class="pb-tier">4</span>
            <span class="pb-name" data-i18n="prizeTierMiss">未猜中</span>
            <span class="pb-sub" data-i18n="prizeTierMissSub"></span>
          </div>
          <div class="lang-grid">
            <div class="lang-col" data-lang="zh-CN">
              <div class="lang-tag" data-i18n="pzLangZhCN">简体中文</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="pzMissTitleZhCN" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
                <textarea id="pzMissDescZhCN" maxlength="120" rows="2"></textarea>
              </div>
            </div>
            <div class="lang-col" data-lang="zh-HK">
              <div class="lang-tag" data-i18n="pzLangZhHK">繁体中文</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="pzMissTitleZhHK" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
                <textarea id="pzMissDescZhHK" maxlength="120" rows="2"></textarea>
              </div>
            </div>
            <div class="lang-col" data-lang="en-US">
              <div class="lang-tag" data-i18n="pzLangEnUS">English</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="pzMissTitleEnUS" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
                <textarea id="pzMissDescEnUS" maxlength="120" rows="2"></textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- 额外奖品：命中特殊数字时全员加奖，独立于上面的四档 -->
        <div class="prize-block bonus-block">
          <div class="pb-head">
            <span class="pb-tier">★</span>
            <span class="pb-name" data-i18n="bonusTitle">全员额外奖励</span>
            <span class="pb-sub" data-i18n="bonusSub"></span>
          </div>
          <div class="form-row">
            <label data-i18n="bonusNumberLab">特殊数字（开奖命中即全员加奖）</label>
            <select id="bzNumber" autocomplete="off">
              <option value="" data-i18n="bonusNumberOff">不启用</option>
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
            </select>
          </div>
          <div class="lang-grid">
            <div class="lang-col" data-lang="zh-CN">
              <div class="lang-tag" data-i18n="pzLangZhCN">简体中文</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="bzTitleZhCN" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
                <textarea id="bzDescZhCN" maxlength="120" rows="2"></textarea>
              </div>
            </div>
            <div class="lang-col" data-lang="zh-HK">
              <div class="lang-tag" data-i18n="pzLangZhHK">繁体中文</div>
              <div class="form-row">
                <label data-i18n="prizeNameLab">奖品名称</label>
                <input type="text" id="bzTitleZhHK" maxlength="32" autocomplete="off">
              </div>
              <div class="form-row">
                <label data-i18n="prizeDescLab">奖品说明</label>
